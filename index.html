<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2e7d32">
<title>AgroGest</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="favicon.ico">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="topbar">
  <div class="brand">🍇 AgroGest <span class="version">v1.4</span></div>
  <div class="topbar-right">
    <div class="socio-wrap">
      <select id="socioSelector" title="Socio activo" onchange="cambiarSocio(this.value)"></select>
    </div>
    <div class="sync-wrap" title="Estado de sincronización con GitHub">
      <span id="syncDot" class="dot dot-gray"></span>
      <span id="syncStatus" class="sync-status" aria-live="polite"></span>
    </div>
  </div>
</header>

<nav id="nav" class="nav"></nav>

<main id="app" class="app"></main>

<dialog id="formDialog" class="form-dialog">
  <form id="entityForm" method="dialog"></form>
</dialog>

<script src="js/app.js" defer></script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js'));
  }
</script>
</body>
</html>
